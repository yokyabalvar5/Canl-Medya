<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı TV ve Radyo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333333;
            margin: 0;
            padding: 15px;
        }
        h2 {
            color: #1a56db;
            font-size: 20px;
            margin-top: 25px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #1a56db;
        }
        /* Grid Düzeni: Mobilde (dik) 2 sütun, yan çevirdikçe otomatik genişler */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        /* Kart Tasarımı (Görseldeki beyaz kutular) */
        .card {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 10px;
            text-decoration: none;
            color: #333333;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            border: 1px solid #eaeaea;
            min-height: 90px;
            box-sizing: border-box;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .card img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            margin-bottom: 10px;
        }
        .card span {
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- TELEVİZYON KANALLARI -->
    <h2>Televizyon</h2>
    <div class="grid-container">
        <a href="https://famelack.com/tv/tr/UyP5uli9gNPXtq" target="_blank" class="card">
            <img src="https://www.aspor.com.tr/assets/images/favicon.ico" alt="A Spor">
            <span>A Spor</span>
        </a>
        <a href="https://famelack.com/tv/tr/e8zax7Tb0zc8Eu" target="_blank" class="card">
            <img src="https://www.trt1.com.tr/favicon.ico" alt="TRT 1">
            <span>TRT 1</span>
        </a>
        <a href="https://famelack.com/tv/tr/w6ttDNPMaglKeI" target="_blank" class="card">
            <img src="https://www.htspor.com/favicon.ico" alt="HT Spor">
            <span>HT Spor</span>
        </a>
        <a href="https://www.tivibuspor.com.tr/" target="_blank" class="card">
            <img src="https://www.tivibuspor.com.tr/favicon.ico" alt="Tivibu Spor">
            <span>Tivibu Spor</span>
        </a>
        <a href="https://famelack.com/tv/tr" target="_blank" class="card">
            <img src="https://famelack.com/favicon.ico" alt="Tüm TV">
            <span>Tüm Kanallar</span>
        </a>
    </div>

            <span>Kral FM</span>
