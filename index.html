<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı TV ve Radyo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 10px;
        }
        h2 {
            color: #3b82f6;
            font-size: 18px;
            margin-top: 20px;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 2px solid #3b82f6;
        }
        /* Grid Düzeni: Yatayda daha fazla sütun sığması için min genişlik */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }
        /* Kart Tasarımı (Sadece İsim, Sade Görünüm) */
        .card {
            background-color: #121212;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 8px;
            text-decoration: none;
            color: #ffffff;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            border: 1px solid #222222;
            min-height: 60px;
            box-sizing: border-box;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            border-color: #3b82f6;
        }
        .card span {
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- TELEVİZYON KANALLARI -->
    <h2>Televizyon</h2>
    <div class="grid-container">
        <a href="https://famelack.com/tv/tr/UyP5uli9gNPXtq" target="_blank" class="card">
            <span>A Spor</span>
        </a>
        <a href="https://famelack.com/tv/tr/e8zax7Tb0zc8Eu" target="_blank" class="card">
            <span>TRT 1</span>
        </a>
        <a href="https://famelack.com/tv/tr/w6ttDNPMaglKeI" target="_blank" class="card">
            <span>HT Spor</span>
        </a>
        <a href="https://famelack.com/tv/tr" target="_blank" class="card">
            <span>Tüm Kanallar</span>
        </a>
    </div>

    <!-- RADYO KANALLARI -->
    <h2>Radyo</h2>
    <div class="grid-container">
        <a href="https://famelack.com/radio/tr/pbm5NmFriHwPZE" target="_blank" class="card">
            <span>Kral FM</span>
        </a>
        <a href="https://famelack.com/radio/tr/m6xDFmFIEkVsFJ" target="_blank" class="card">
            <span>Süper FM</span>
        </a>
        <a href="https://famelack.com/radio/tr/7G3ONCQiyKXI3g" target="_blank" class="card">
            <span>Best FM</span>
        </a>
        <a href="https://famelack.com/radio/tr/PaEfNXc0A5SA1k" target="_blank" class="card">
            <span>Power FM</span>
        </a>
        <a href="https://famelack.com/radio/tr/PjnCNYN7hPecx6" target="_blank" class="card">
            <span>Karadeniz FM</span>
        </a>
        <a href="https://famelack.com/radio/tr/YlvTB1ZC8zTzDK" target="_blank" class="card">
            <span>Kral Türk Fm</span>
        </a>
        <a href="https://famelack.com/radio/tr/gy9PX5XN4lLmOB" target="_blank" class="card">
            <span>Power Türk</span>
        </a>
        <a href="https://famelack.com/radio/tr/Zo09g79tLgUE4G" target="_blank" class="card">
            <span>Radyo Alaturka</span>
        </a>
        <a href="https://famelack.com/radio/tr/Evbh04klEcsMZz" target="_blank" class="card">
            <span>A Spor Radyo</span>
        </a>
        <a href="https://famelack.com/radio/tr" target="_blank" class="card">
            <span>Tüm Radyolar</span>
        </a>
    </div>

</body>
</html>
